name: Animate my GitHub contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "12 0 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate the animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RedMoon-002
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=#ff4767&color_dots=#101522,#4d1e2b,#80263b,#c73755,#ff6780

      - name: Commit refreshed animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update animated contribution snake"
            git push
          fi
